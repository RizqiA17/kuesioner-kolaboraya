<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <title>Login Fasilitator</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-white shadow-lg rounded-2xl p-6 sm:p-8">
        <div class="text-center mb-6">
            <h1 class="text-3xl font-bold text-gray-800">Login Fasilitator</h1>
            <p class="text-gray-500 text-sm mt-1">Masuk untuk mengelola hasil kuesioner</p>
        </div>

        <form id="loginForm" class="space-y-5">
            <div>
                <label class="block text-gray-700 mb-1 font-medium">Username</label>
                <input type="text" name="username" required
                    class="w-full border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>

            <div>
                <label class="block text-gray-700 mb-1 font-medium">Password</label>
                <input type="password" name="password" required
                    class="w-full border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>

            <button type="submit"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 rounded-lg transition">
                Masuk
            </button>
        </form>

        <p id="errorMsg" class="mt-4 text-red-600 text-center hidden text-sm">
            Username atau password salah.
        </p>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);

            try {
                const res = await fetch('/api/login_fasilitator.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: formData.get('username'),
                        password: formData.get('password')
                    })
                });

                const data = await res.json();
                if (data.success) {
                    window.location.href = data.redirect || '/dashboard';
                } else {
                    const errorMsg = document.getElementById('errorMsg');
                    errorMsg.classList.remove('hidden');
                    errorMsg.textContent = data.message || 'Username atau password salah.';
                }
            } catch (err) {
                const errorMsg = document.getElementById('errorMsg');
                errorMsg.classList.remove('hidden');
                errorMsg.textContent = 'Terjadi kesalahan server. Silakan coba lagi.';
            }
        });
    </script>
</body>

</html>
