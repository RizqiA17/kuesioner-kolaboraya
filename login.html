<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Fasilitator</title>
    <link rel="stylesheet" href="./assets/style.min.css">
    <style>
        .fade-in {
            animation: fadeIn 0.4s ease-in-out;
        }

        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(-5px); }
            100% { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

<body class="flex items-center justify-center min-h-screen p-4 bg-gray-100">

    <div class="w-full max-w-md p-6 bg-white shadow-lg rounded-2xl sm:p-8">
        <div class="mb-6 text-center">
            <h1 class="text-3xl font-bold text-gray-800">Login Fasilitator</h1>
            <p class="mt-1 text-sm text-gray-500">Masuk untuk mengelola hasil kuesioner</p>
        </div>

        <form id="loginForm" class="space-y-5">
            <div>
                <label class="block mb-1 font-medium text-gray-700">Username</label>
                <input type="text" name="username" required
                    class="w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>

            <div>
                <label class="block mb-1 font-medium text-gray-700">Password</label>
                <input type="password" name="password" required
                    class="w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>

            <button type="submit"
                class="w-full px-4 py-2 rounded-md text-sm font-medium text-semibold flex items-center gap-2 max-sm:flex-grow border-none justify-center shadow-md text-slate-50 bg-blue-500 hover:bg-blue-600 hover:shadow-xl transition-all duration-200 hover:scale-[1.02] active:translate-y-0.5 active:scale-1 active:bg-blue-700">
                Masuk
            </button>
        </form>

        <p id="errorMsg" class="hidden mt-4 text-sm text-center text-red-600 fade-in">
            Username atau password salah.
        </p>
    </div>

    <script>
        const errorMsg = document.getElementById('errorMsg');

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMsg.classList.add('hidden'); // Reset error

            const formData = new FormData(e.target);

            try {
                const res = await fetch('/api/login_fasilitator.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: formData.get('username'),
                        password: formData.get('password')
                    })
                });

                const data = await res.json();

                if (data.success) {
                    window.location.href = data.redirect || '/dashboard';
                } else {
                    errorMsg.textContent = data.message || 'Username atau password salah.';
                    errorMsg.classList.remove('hidden');
                }
            } catch (err) {
                errorMsg.textContent = 'Terjadi kesalahan server. Silakan coba lagi.';
                errorMsg.classList.remove('hidden');
            }
        });
    </script>
</body>

</html>
