<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <title>Dashboard Fasilitator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
</head>

<body class="bg-gray-100 p-6">

    <div class="max-w-6xl mx-auto bg-white rounded-xl shadow-md p-4 md:p-6">
        <!-- Header -->
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-3 md:gap-0">
            <h1 class="text-2xl font-bold">Dashboard Fasilitator</h1>
            <div class="flex flex-wrap md:flex-row items-center gap-2 md:gap-3 w-full md:w-auto">
                <button id="shareLinkBtn"
                    class="flex-1 md:flex-none bg-green-600 text-white px-3 py-1 rounded hover:bg-green-700">
                    Bagikan Link Kuesioner
                </button>
                <button id="qrBtn"
                    class="flex-1 md:flex-none bg-yellow-500 text-white px-3 py-1 rounded hover:bg-yellow-600">
                    Tampilkan QR
                </button>
                <button id="toggleOpenBtn"
                    class="flex-1 md:flex-none bg-purple-600 text-white px-3 py-1 rounded hover:bg-purple-700">
                    Loading...
                </button>
                <button id="logoutBtn"
                    class="flex-1 md:flex-none bg-red-600 text-white px-3 py-1 rounded hover:bg-red-700">
                    Logout
                </button>
            </div>
        </div>

        <!-- Modal QR -->
        <div id="qrModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden p-4">
            <div class="bg-white p-6 rounded-lg text-center relative max-w-sm w-full">
                <h2 class="text-lg font-bold mb-4">Scan QR untuk membuka kuesioner</h2>
                <canvas id="qrCanvas" class="mx-auto mb-4"></canvas>
                <div class="flex flex-col sm:flex-row justify-center gap-2">
                    <button id="downloadQrBtn"
                        class="flex-1 bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">
                        Download QR
                    </button>
                    <button id="closeQr"
                        class="flex-1 bg-red-600 text-white px-4 py-2 rounded hover:bg-red-700">Tutup</button>
                </div>
            </div>
        </div>

        <!-- Pengaturan Kuota & Aksi -->
        <div class="flex flex-col sm:flex-row flex-wrap items-center gap-3 mb-6">
            <label class="font-medium flex-shrink-0">Kuota Kursi:</label>
            <input id="quotaInput" type="number" value="150" min="1"
                class="border p-2 w-full sm:w-24 rounded flex-shrink-0">
            <button id="saveQuota"
                class="bg-indigo-600 text-white px-4 py-2 rounded hover:bg-indigo-700 flex-1 sm:flex-none">
                Simpan Kuota
            </button>
            <button id="updateRanking"
                class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 flex-1 sm:flex-none">
                Update Ranking
            </button>
            <select id="filterStatus" class="border p-2 rounded flex-1 sm:flex-none w-full sm:w-auto">
                <option value="ALL">Semua Peserta</option>
                <option value="LULUS">Hanya LULUS</option>
                <option value="TIDAK LOLOS">Hanya Tidak Lulus</option>
            </select>
            <button id="downloadPassed"
                class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700 ml-auto w-full sm:w-auto">
                Download Peserta Lulus
            </button>
        </div>

        <p id="quotaInfo" class="text-gray-700 mb-4 text-sm"></p>

        <!-- Tabel Peserta -->
        <div class="overflow-x-auto">
            <table class="w-full border-collapse border text-xs sm:text-sm">
                <thead class="bg-gray-200">
                    <tr>
                        <th class="border px-2 py-2">#</th>
                        <th class="border px-2 py-2">Nama</th>
                        <th class="border px-2 py-2">Email</th>
                        <th class="border px-2 py-2">No. Telepon</th>
                        <th class="border px-2 py-2">Organisasi</th>
                        <th class="border px-2 py-2">Skor</th>
                        <th class="border px-2 py-2">Integritas</th>
                        <th class="border px-2 py-2">Ranking</th>
                        <th class="border px-2 py-2">Status</th>
                    </tr>
                </thead>
                <tbody id="dataTable"></tbody>
            </table>
        </div>

        <!-- Pagination -->
        <div class="flex flex-col sm:flex-row justify-between items-center mt-4 text-sm gap-2 sm:gap-0">
            <div>
                <label for="limitSelect">Tampilkan: </label>
                <select id="limitSelect" class="border rounded px-2 py-1">
                    <option value="10">10</option>
                    <option value="20" selected>20</option>
                    <option value="50">50</option>
                </select> baris
            </div>
            <div id="paginationControls" class="flex flex-wrap items-center gap-1"></div>
        </div>
    </div>

    <script>
        let currentPage = 1;
        let limit = 20;
        let currentFilter = "ALL";
        const questionnaireUrl = window.location.origin;

        const qrModal = document.getElementById('qrModal');
        const qrCanvas = document.getElementById('qrCanvas');
        const toggleOpenBtn = document.getElementById('toggleOpenBtn');

        // Cek login dan load data awal
        (async () => {
            const res = await fetch('api/check_auth.php');
            const data = await res.json();
            if (!data.authenticated) {
                location.href = 'login.html';
            } else {
                await loadQuota();
                await loadData();
                await loadOpenStatus();
            }
        })();

        // Logout
        document.getElementById('logoutBtn').addEventListener('click', () => {
            window.location.href = 'api/logout.php';
        });

        // Tombol share
        document.getElementById('shareLinkBtn').addEventListener('click', () => {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(questionnaireUrl)
                    .then(() => alert("Link kuesioner disalin ke clipboard!"))
                    .catch(err => alert("Gagal menyalin link: " + err));
            } else {
                prompt("Salin link kuesioner berikut:", questionnaireUrl);
            }
        });

        // Tombol QR
        document.getElementById('qrBtn').addEventListener('click', () => {
            QRCode.toCanvas(qrCanvas, questionnaireUrl, { width: 200 }, function (error) {
                if (error) console.error(error);
                qrModal.classList.remove('hidden');
            });
        });
        document.getElementById('closeQr').addEventListener('click', () => qrModal.classList.add('hidden'));
        document.getElementById('downloadQrBtn').addEventListener('click', () => {
            const link = document.createElement('a');
            link.href = qrCanvas.toDataURL("image/png");
            link.download = "kuesioner_qr.png";
            link.click();
        });

        // Open/Close Kuesioner
        async function loadOpenStatus() {
            try {
                const res = await fetch('api/open_question.php', { method: 'GET' });
                const data = await res.json();
                if (data.success && typeof data.open_question !== 'undefined') {
                    updateOpenButton(data.open_question);
                } else {
                    toggleOpenBtn.textContent = 'Tidak diketahui';
                }
            } catch (e) {
                toggleOpenBtn.textContent = 'Error';
                console.error(e);
            }
        }


        function updateOpenButton(status) {
            toggleOpenBtn.textContent = status == 1 ? 'Tutup Kuesioner' : 'Buka Kuesioner';
            toggleOpenBtn.dataset.status = status;
        }

        toggleOpenBtn.addEventListener('click', async () => {
            let newStatus = toggleOpenBtn.dataset.status == 1 ? 0 : 1;
            try {
                const res = await fetch('api/open_question.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ open: newStatus })
                });
                const data = await res.json();
                if (data.success) {
                    updateOpenButton(newStatus);
                    alert(data.message);
                } else {
                    alert(data.message || 'Gagal memperbarui status');
                }
            } catch (e) {
                console.error(e);
                alert('Terjadi kesalahan saat menghubungi server.');
            }
        });

        // Kuota
        async function loadQuota() {
            const res = await fetch('api/get_quota.php');
            const data = await res.json();
            document.getElementById('quotaInput').value = data.quota;
            updateQuotaInfo(data.quota);
        }
        function updateQuotaInfo(q) {
            document.getElementById('quotaInfo').textContent =
                `Kuota kursi saat ini: ${q}. Peserta dengan ranking ≤ ${q} dan integritas LULUS akan berstatus LULUS.`;
        }
        document.getElementById('saveQuota').addEventListener('click', async () => {
            const newQuota = parseInt(document.getElementById('quotaInput').value);
            const res = await fetch('api/update_quota.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ quota: newQuota })
            });
            const data = await res.json();
            alert(`Kuota diperbarui menjadi ${data.quota}`);
            await fetch('api/update_ranking.php');
            await loadData();
        });

        document.getElementById('updateRanking').addEventListener('click', async () => {
            await fetch('api/update_ranking.php');
            await loadData();
        });

        document.getElementById('filterStatus').addEventListener('change', e => {
            currentFilter = e.target.value;
            loadData(currentPage);
        });

        document.getElementById('limitSelect').addEventListener('change', e => {
            limit = parseInt(e.target.value);
            currentPage = 1;
            loadData(currentPage);
        });

        document.getElementById('downloadPassed').addEventListener('click', () => {
            window.location.href = 'api/export_selected.php';
        });

        // Load data peserta
        async function loadData(page = 1) {
            const res = await fetch(`api/get_results.php?page=${page}&limit=${limit}`);
            const result = await res.json();
            const tbody = document.getElementById('dataTable');
            tbody.innerHTML = '';

            const filtered = result.data.filter(item =>
                currentFilter === 'ALL' ? true : item.status === currentFilter
            );

            filtered.forEach((item) => {
                const integrityColor = item.integrity_status === 'LULUS' ? 'text-green-600' : 'text-red-600';
                const statusColor = item.status === 'LULUS' ? 'text-green-600 font-semibold' : 'text-gray-500';

                const row = document.createElement('tr');
                row.classList.add('text-center', 'border', 'hover:bg-gray-50');
                row.innerHTML = `
                    <td class="border px-2 py-1">${item.ranking}</td>
                    <td class="border px-2 py-1">${item.name}</td>
                    <td class="border px-2 py-1">${item.email}</td>
                    <td class="border px-2 py-1">${item.phone}</td>
                    <td class="border px-2 py-1">${item.organization}</td>
                    <td class="border px-2 py-1">${item.core_score}</td>
                    <td class="border px-2 py-1 ${integrityColor}">${item.integrity_status}</td>
                    <td class="border px-2 py-1">${item.ranking ?? '-'}</td>
                    <td class="border px-2 py-1 ${statusColor}">${item.status}</td>
                `;
                tbody.appendChild(row);
            });

            renderPagination(result.page, result.totalPages);
        }

        function renderPagination(page, totalPages) {
            const container = document.getElementById('paginationControls');
            container.innerHTML = '';

            const createBtn = (text, pageNum, disabled = false, active = false) => {
                const btn = document.createElement('button');
                btn.textContent = text;
                btn.className = `px-2 py-1 border rounded ${active ? 'bg-blue-600 text-white' : 'bg-gray-100 hover:bg-gray-200'} ${disabled ? 'opacity-50 cursor-not-allowed' : ''}`;
                if (!disabled && !active) btn.addEventListener('click', () => loadData(pageNum));
                return btn;
            };

            container.appendChild(createBtn('Prev', page - 1, page <= 1));
            const range = 2;
            const start = Math.max(1, page - range);
            const end = Math.min(totalPages, page + range);
            for (let i = start; i <= end; i++) {
                container.appendChild(createBtn(i, i, false, i === page));
            }
            container.appendChild(createBtn('Next', page + 1, page >= totalPages));
            currentPage = page;
        }
    </script>
</body>

</html>
