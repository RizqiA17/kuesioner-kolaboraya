<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuesioner Kandidat Peserta</title>
    <link rel="stylesheet" href="./assets/style.min.css">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
</head>

<body class="min-h-screen bg-gray-50">
    <div class="max-w-3xl px-4 py-10 mx-auto">
        <h1 class="mb-8 text-3xl font-bold text-center">Kuesioner Kandidat Peserta</h1>

        <div id="successMsg"
            class="flex items-center hidden gap-2 p-4 mb-4 text-sm bg-green-100 border border-green-500 rounded-md text-slate-800 rounded-base"
            role="alert">
            <span class="text-green-700 material-symbols-outlined">
                check
            </span>
            <p class="font-semibold text-center text-green-700">
                Jawaban Anda telah berhasil disimpan. Terima kasih telah mengisi kuesioner.
            </p>
        </div>

        <div id="errorMsg"
            class="flex items-center hidden gap-2 p-4 mb-4 text-sm bg-red-100 border border-red-500 rounded-md text-slate-800 rounded-base"
            role="alert">
            <span class="text-red-700 material-symbols-outlined">
                close
            </span>
            <p class="font-semibold text-center text-red-700">
                Terjadi kesalahan saat menyimpan jawaban. Silakan coba lagi.
            </p>
        </div>

        <form id="kuesionerForm" class="p-6 space-y-6 bg-white shadow-lg rounded-2xl">
            <div>
                <label class="block mb-1 font-medium text-gray-700">Nama Lengkap</label>
                <input type="text" name="name" required
                    class="w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>

            <div>
                <label class="block mb-1 font-medium text-gray-700">Email</label>
                <input type="email" name="email" required
                    class="w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                <p class="mt-1 text-sm text-gray-500">*pastikan email aktif</p>
            </div>

            <div>
                <label class="block mb-1 font-medium text-gray-700">No. Telepon</label>
                <input type="tel" name="phone" required
                    class="w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>

            <div>
                <label class="block mb-1 font-medium text-gray-700">Organisasi</label>
                <input type="text" name="organization"
                    class="w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                <p class="mt-1 text-sm text-gray-500">*isi strip (-) jika tidak ada</p>
            </div>

            <div>
                <label class="block mb-1 font-medium text-gray-700">Alamat Kantor</label>
                <textarea name="office_address" conte
                    class="w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none"></textarea>
                <p class="mt-1 text-sm text-gray-500">*isi strip (-) jika tidak ada</p>
            </div>

            <div id="questionList">
                <p class="py-10 text-center text-gray-500">Memuat pertanyaan...</p>
            </div>

            <div class="pt-6 text-center">
                <button type="submit"
                    class="w-full px-4 py-2 rounded-md text-sm font-semibold font-medium flex items-center gap-2 max-sm:flex-grow border-none justify-center shadow-md text-slate-50 bg-blue-500 hover:bg-blue-600 hover:shadow-xl transition-all duration-200 hover:scale-[1.02] active:translate-y-0.5 active:scale-1 active:bg-blue-700"
                    id="submitBtn">
                    Kirim Jawaban
                </button>
            </div>
        </form>
    </div>

    <script>
        const submitBtn = document.getElementById('submitBtn');

        // === Ambil Pertanyaan dari Database ===
        document.addEventListener("DOMContentLoaded", async () => {
            const container = document.getElementById("questionList");

            try {
                const res = await fetch('/api/get_questions.php');
                const result = await res.json();

                if (!result.success) throw new Error('Gagal memuat data');

                container.innerHTML = '';
                result.data.forEach((q, i) => {
                    const block = document.createElement('div');
                    block.className = 'mb-5 p-4 border rounded-lg hover:bg-gray-50 transition';

                    const labels = ['Sangat Tidak Setuju', 'Tidak Setuju', 'Netral', 'Setuju', 'Sangat Setuju'];

                    block.innerHTML = `
                        <p class="mb-3 font-medium text-gray-800">${i + 1}. ${q.question_text}</p>
                        <div class="flex flex-col flex-wrap w-full gap-4 text-sm text-gray-700 sm:flex-row sm:justify-between">
                            ${[1, 2, 3, 4, 5].map(v => `
                                <label class="flex items-center gap-2">
                                    <input type="radio" name="q${q.id}" value="${v}" required>
                                    ${labels[v - 1]}
                                </label>
                            `).join('')}
                        </div>
                    `;

                    container.appendChild(block);
                });
            } catch (e) {
                container.innerHTML = '<p class="text-center text-red-600">Gagal memuat pertanyaan.</p>';
            }
        });

        // === Submit Jawaban ===
        document.getElementById('kuesionerForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            submitBtn.disabled = true;
            submitBtn.textContent = 'Mengirim...';

            const formData = new FormData(e.target);
            const answers = {};

            for (let [key, val] of formData.entries()) {
                if (key.startsWith('q')) answers[key] = parseInt(val);
            }

            const payload = {
                name: formData.get('name'),
                email: formData.get('email'),
                phone: formData.get('phone'),
                organization: formData.get('organization'),
                office_address: formData.get('office_address'),
                answers: answers
            };

            try {
                const res = await fetch('/api/submit_kuesioner.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await res.json();

                if (data.success) {
                    document.getElementById('successMsg').classList.remove('hidden');
                    document.getElementById('errorMsg').classList.add('hidden');
                    e.target.reset();
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                } else {
                    document.getElementById('errorMsg').classList.remove('hidden');
                    document.getElementById('successMsg').classList.add('hidden');
                }
            } catch (err) {
                document.getElementById('errorMsg').classList.remove('hidden');
                document.getElementById('successMsg').classList.add('hidden');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Kirim Jawaban';
            }
        });
    </script>
</body>

</html>
