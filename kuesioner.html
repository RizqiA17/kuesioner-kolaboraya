<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <title>Kuesioner Kandidat Peserta</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50 min-h-screen">
    <div class="max-w-3xl mx-auto py-10 px-4">
        <h1 class="text-3xl font-bold text-center mb-8">Kuesioner Kandidat Peserta</h1>

        <form id="kuesionerForm" class="space-y-6 bg-white shadow-lg rounded-2xl p-6">
            <div>
                <label class="block text-gray-700 mb-1 font-medium">Nama Lengkap</label>
                <input type="text" name="name" required
                    class="w-full border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>

            <div>
                <label class="block text-gray-700 mb-1 font-medium">Email</label>
                <input type="email" name="email" required
                    class="w-full border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>

            <div id="questionList">
                <p class="text-gray-500 text-center py-10">Memuat pertanyaan...</p>
            </div>

            <div class="text-center pt-6">
                <button type="submit"
                    class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-6 py-2 rounded-lg transition">
                    Kirim Jawaban
                </button>
            </div>
        </form>

        <p id="successMsg" class="mt-6 text-green-700 text-center hidden font-semibold">
            Jawaban Anda telah berhasil disimpan. Terima kasih telah mengisi kuesioner.
        </p>
        <p id="errorMsg" class="mt-6 text-red-700 text-center hidden font-semibold">
            Terjadi kesalahan saat menyimpan jawaban. Silakan coba lagi.
        </p>
    </div>

    <script>
        // === Ambil Pertanyaan dari Database ===
        document.addEventListener("DOMContentLoaded", async () => {
            const container = document.getElementById("questionList");

            try {
                const res = await fetch('/api/get_questions.php');
                const result = await res.json();

                if (!result.success) throw new Error('Gagal memuat data');

                container.innerHTML = '';
                result.data.forEach((q, i) => {
                    const block = document.createElement('div');
                    block.className = 'mb-5 p-4 border rounded-lg hover:bg-gray-50 transition';

                    block.innerHTML = `
            <p class="font-medium text-gray-800 mb-3">${i + 1}. ${q.question_text}</p>
            <div class="flex flex-wrap gap-4 justify-between text-sm text-gray-700">
            ${[1, 2, 3, 4, 5].map(v => `
                <label class="flex items-center gap-1">
                    <input type="radio" name="q${q.id}" value="${v}" required>
                ${v}
                </label>
            `).join('')}
            </div>
            `;
                    container.appendChild(block);
                });
            } catch (e) {
                container.innerHTML = '<p class="text-red-600 text-center">Gagal memuat pertanyaan.</p>';
            }
        });

        // === Submit Jawaban ===
        document.getElementById('kuesionerForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const formData = new FormData(e.target);
            const answers = {};

            // Kumpulkan jawaban q1..q15
            for (let [key, val] of formData.entries()) {
                if (key.startsWith('q')) answers[key] = parseInt(val);
            }

            const payload = {
                name: formData.get('name'),
                email: formData.get('email'),
                answers: answers
            };

            const res = await fetch('/api/submit_kuesioner.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const data = await res.json();

            if (data.success) {
                document.getElementById('successMsg').classList.remove('hidden');
                e.target.reset();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            } else {
                document.getElementById('errorMsg').classList.remove('hidden');
            }
        });
    </script>
</body>

</html>
